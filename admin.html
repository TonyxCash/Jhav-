<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f2ec"><meta name="robots" content="noindex,nofollow">
<title>JHAVÈ Admin — Gestione catalogo</title>
<style>
:root{--paper:#fffefa;--ink:#171715;--muted:#77746d;--line:#e9e3d8;--gold:#b99a62;--serif:Georgia,'Times New Roman',serif;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f3ed;color:var(--ink);font-family:var(--sans);padding:22px}.shell{width:min(100%,1050px);margin:auto}.brand{text-align:center;color:var(--gold);font:600 32px var(--serif);letter-spacing:.19em}.sub{text-align:center;color:var(--muted);font-size:9px;letter-spacing:.35em;margin-top:6px;text-transform:uppercase}.card{background:var(--paper);border:1px solid #e7dfd1;box-shadow:0 12px 40px #4131160d;padding:clamp(20px,4vw,34px);margin:26px 0}.eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#9b7d49;font-weight:bold}.card h1{font:32px var(--serif);font-weight:400;margin:10px 0 20px}.muted{color:var(--muted);font-size:13px;line-height:1.6}label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:14px 0 7px;color:#555248}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);background:white;font:14px var(--sans);border-radius:0}textarea{min-height:84px;resize:vertical}input:focus,textarea:focus,select:focus{outline:1px solid var(--gold)}button{border:1px solid var(--ink);background:var(--ink);color:white;padding:13px 17px;font:10px var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}button:hover{background:var(--gold);border-color:var(--gold)}button:disabled{opacity:.5;cursor:wait}.secondary{background:transparent;color:var(--ink)}.danger{border-color:#a44;background:#fff;color:#a33}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.toolbar button{margin-left:6px}.message{display:none;margin:14px 0;padding:12px;background:#f4efe5;color:#6e5732;font-size:12px;line-height:1.5}.message.show{display:block}#dashboard{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.wide{grid-column:1/-1}.products{display:grid;gap:10px;margin-top:18px}.product{display:grid;grid-template-columns:88px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);padding:12px}.product img,.placeholder{width:88px;height:104px;object-fit:cover;background:#eee9df;display:grid;place-items:center;color:#9b8b6c;font:18px var(--serif)}.product strong{font:18px var(--serif);font-weight:400}.product small{display:block;color:var(--muted);font-size:11px;margin-top:6px;line-height:1.5}.product-actions{display:flex;gap:7px;flex-wrap:wrap}.product-actions button{padding:10px}.preview{width:100%;max-width:190px;aspect-ratio:4/5;object-fit:cover;background:#eee9df;display:block;margin-top:12px}.foot{text-align:center;color:#888176;font-size:9px;letter-spacing:.13em;margin:26px 0;text-transform:uppercase}
@media(max-width:620px){body{padding:12px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.product{grid-template-columns:64px 1fr}.product img,.placeholder{width:64px;height:82px}.product-actions{grid-column:1/-1}.toolbar button{margin:5px 4px 0 0}}
</style></head><body>
<main class="shell"><div class="brand">JHAVÈ</div><div class="sub">Official · Admin</div>
<section class="card" id="login"><div class="eyebrow">Area riservata</div><h1>Benvenuto</h1><p class="muted">Accedi per gestire prodotti, prezzi, taglie e fotografie del catalogo.</p>
<form id="loginForm"><label for="email">Email amministratore</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Accedi al pannello</button></form><div class="message" id="loginMessage" role="status"></div></section>
<section class="card" id="dashboard"><div class="toolbar"><div><div class="eyebrow">Catalogo e contenuti</div><h1>Gestione JHAVÈ</h1><div class="muted" id="accountEmail"></div></div><div><button class="secondary" id="newProduct">Nuovo prodotto</button><button class="secondary" id="logout">Esci</button></div></div>
<div class="message" id="notice" role="status"></div><div id="productList" class="products"></div>
<section id="editor" style="display:none;border-top:1px solid var(--line);margin-top:28px;padding-top:22px"><div class="eyebrow">Scheda prodotto</div><h1 id="editorTitle">Nuovo prodotto</h1>
<form id="productForm"><input type="hidden" id="productId"><div class="grid">
<div><label for="name">Nome prodotto</label><input id="name" required maxlength="100"></div><div><label for="slug">Identificativo (slug)</label><input id="slug" required pattern="[a-z0-9-]+" placeholder="es. jeans-sartoriale"></div>
<div><label for="category">Categoria</label><select id="category"><option value="trousers">Pantaloni</option><option value="shirts">T-shirt</option></select></div><div><label for="price">Prezzo in euro (lascia vuoto se da definire)</label><input id="price" type="number" min="0" step="0.01" inputmode="decimal"></div>
<div class="wide"><label for="description">Descrizione</label><textarea id="description"></textarea></div><div class="wide"><label for="sizes">Taglie disponibili (separate da virgola)</label><input id="sizes" placeholder="46, 48, 50, 52, 54, 56"></div>
<div><label for="sortOrder">Ordine di visualizzazione</label><input id="sortOrder" type="number" step="1" value="0"></div><div><label for="active">Visibilità sul sito</label><select id="active"><option value="true">Pubblicato</option><option value="false">Nascosto</option></select></div>
<div class="wide"><label for="photo">Fotografia prodotto (JPG, PNG o WebP · max 10 MB)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview" alt="Anteprima fotografia" style="display:none"></div>
</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:22px"><button id="saveProduct" type="submit">Salva prodotto</button><button class="secondary" id="cancelEdit" type="button">Annulla</button></div></form></section>
</section><div class="foot">JHAVÈ Official · Accesso privato</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://ftkzjhjumgojmcvybzqu.supabase.co";
const SUPABASE_KEY="sb_publishable_0EU8yVrYfT2Zg8NWzUqxPA_UGWk2O9O";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let currentUser=null,products=[];
function message(id,text){$(id).textContent=text;$(id).classList.add("show")}
function clearMessage(id){$(id).classList.remove("show")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function euro(v){return v==null?"Prezzo da definire":new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(v)}
async function enter(user){
 const {data,error}=await db.from("jhave_admins").select("user_id").eq("user_id",user.id).maybeSingle();
 if(error||!data){await db.auth.signOut();$("login").style.display="block";$("dashboard").style.display="none";message("loginMessage","Questo account non è autorizzato come amministratore. Verifica che la configurazione SQL sia stata eseguita correttamente.");return}
 currentUser=user;$("login").style.display="none";$("dashboard").style.display="block";$("accountEmail").textContent=user.email||"Account amministratore";await loadProducts();
}
async function loadProducts(){
 clearMessage("notice");$("productList").innerHTML="<p class='muted'>Caricamento catalogo…</p>";
 const {data,error}=await db.from("products").select("*").order("sort_order",{ascending:true});
 if(error){$("productList").innerHTML="";message("notice","Errore nel caricamento: "+error.message);return}
 products=data||[];renderList();
}
function renderList(){
 if(!products.length){$("productList").innerHTML="<p class='muted'>Nessun prodotto. Crea la prima scheda.</p>";return}
 $("productList").innerHTML=products.map(p=>'<article class="product">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="">':'<div class="placeholder">J</div>')+'<div><strong>'+esc(p.name)+'</strong><small>'+esc(p.category==="shirts"?"T-shirt":"Pantaloni")+' · '+euro(p.price)+' · '+(p.active?"Pubblicato":"Nascosto")+'<br>Taglie: '+esc((p.sizes||[]).join(", "))+'</small></div><div class="product-actions"><button type="button" data-edit="'+esc(p.id)+'" class="secondary">Modifica</button><button type="button" data-delete="'+esc(p.id)+'" class="danger">Elimina</button></div></article>').join("");
}
function openEditor(p){
 $("productForm").reset();$("productId").value=p?.id||"";$("name").value=p?.name||"";$("slug").value=p?.slug||"";$("category").value=p?.category||"trousers";$("price").value=p?.price??"";$("description").value=p?.description||"";$("sizes").value=(p?.sizes||[]).join(", ");$("sortOrder").value=p?.sort_order??(products.length+1);$("active").value=String(p?.active??true);$("photo").value="";$("preview").style.display=p?.image_url?"block":"none";$("preview").src=p?.image_url||"";$("editorTitle").textContent=p?"Modifica prodotto":"Nuovo prodotto";$("editor").style.display="block";$("editor").scrollIntoView({behavior:"smooth",block:"start"});
}
$("newProduct").onclick=()=>openEditor(null);$("cancelEdit").onclick=()=>{$("editor").style.display="none"};
$("productList").addEventListener("click",async e=>{
 const edit=e.target.closest("[data-edit]");if(edit){openEditor(products.find(p=>p.id===edit.dataset.edit));return}
 const del=e.target.closest("[data-delete]");if(del){const p=products.find(x=>x.id===del.dataset.delete);if(!p||!confirm('Eliminare "'+p.name+'"?'))return;
 const {error}=await db.from("products").delete().eq("id",p.id);if(error)message("notice","Eliminazione non riuscita: "+error.message);else{message("notice","Prodotto eliminato.");await loadProducts()}}
});
$("photo").addEventListener("change",()=>{const file=$("photo").files[0];if(!file)return;if(file.size>10*1024*1024){$("photo").value="";message("notice","La foto supera il limite di 10 MB.");return}if(!["image/jpeg","image/png","image/webp"].includes(file.type)){$("photo").value="";message("notice","Formato non supportato. Usa JPG, PNG o WebP.");return} $("preview").src=URL.createObjectURL(file);$("preview").style.display="block"});
$("productForm").addEventListener("submit",async e=>{
 e.preventDefault();clearMessage("notice");const btn=$("saveProduct");btn.disabled=true;btn.textContent="Salvataggio…";
 try{
 const id=$("productId").value;const payload={name:$("name").value.trim(),slug:$("slug").value.trim().toLowerCase(),category:$("category").value,description:$("description").value.trim(),price:$("price").value===""?null:Number($("price").value),sizes:$("sizes").value.split(",").map(x=>x.trim()).filter(Boolean),sort_order:Number($("sortOrder").value)||0,active:$("active").value==="true",updated_at:new Date().toISOString()};
 if(!payload.name||!payload.slug||!Number.isFinite(payload.price??0)||payload.price<0)throw new Error("Controlla nome, slug e prezzo.");
 let saved;
 if(id){const r=await db.from("products").update(payload).eq("id",id).select().single();if(r.error)throw r.error;saved=r.data}
 else{const r=await db.from("products").insert(payload).select().single();if(r.error)throw r.error;saved=r.data}
 const file=$("photo").files[0];
 if(file){const ext=file.name.split(".").pop().toLowerCase();const path=saved.id+"/"+Date.now()+"."+ext;const up=await db.storage.from("jhave-products").upload(path,file,{upsert:true,contentType:file.type});
 if(up.error)throw up.error;const pub=db.storage.from("jhave-products").getPublicUrl(path).data.publicUrl;const upd=await db.from("products").update({image_url:pub,updated_at:new Date().toISOString()}).eq("id",saved.id);if(upd.error)throw upd.error}
 $("editor").style.display="none";message("notice","Prodotto salvato correttamente.");await loadProducts();
 }catch(err){message("notice","Salvataggio non riuscito: "+(err.message||"errore imprevisto"))}
 finally{btn.disabled=false;btn.textContent="Salva prodotto"}
});
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();clearMessage("loginMessage");$("submit").disabled=true;$("submit").textContent="Verifica…";const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("submit").disabled=false;$("submit").textContent="Accedi al pannello";if(error){message("loginMessage","Accesso non riuscito. Controlla email e password.");return}await enter(data.user)});
$("logout").onclick=async()=>{await db.auth.signOut();currentUser=null;$("dashboard").style.display="none";$("login").style.display="block";$("loginForm").reset()};
db.auth.getSession().then(({data,error})=>{if(!error&&data.session)enter(data.session.user)});
</script></body></html>
